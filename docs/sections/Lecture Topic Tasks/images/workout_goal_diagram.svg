<svg width="680" height="720" viewBox="0 0 680 720" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>KAOS Goal Diagram: AND-decomposition of A workout session is logged</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, sans-serif; fill: #1a1a1a; }
    .th  { font-size: 13px; font-weight: 600; }
    .ts  { font-size: 11px; fill: #555; }
    .label { font-size: 11px; fill: #333; font-style: italic; }
  </style>

  <!-- ROOT GOAL -->
  <rect x="190" y="24" width="300" height="56" rx="10" fill="#DDD8FC" stroke="#7F77DD" stroke-width="1"/>
  <text class="th" x="340" y="48" text-anchor="middle" dominant-baseline="central">A workout session is logged</text>
  <text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">Root goal (AND-refined)</text>

  <!-- AND label + trunk -->
  <text class="label" x="340" y="102" text-anchor="middle">AND-refinement</text>
  <line x1="340" y1="80" x2="340" y2="118" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Horizontal bar -->
  <line x1="72" y1="118" x2="608" y2="118" stroke="#555" stroke-width="1"/>
  <line x1="72"  y1="118" x2="72"  y2="138" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="245" y1="118" x2="245" y2="138" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="435" y1="118" x2="435" y2="138" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="608" y1="118" x2="608" y2="138" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- SUB-GOALS -->
  <rect x="20"  y="138" width="105" height="54" rx="8" fill="#C2ECD9" stroke="#1D9E75" stroke-width="1"/>
  <text class="th" x="72"  y="158" text-anchor="middle" dominant-baseline="central">Session is</text>
  <text class="th" x="72"  y="176" text-anchor="middle" dominant-baseline="central">opened</text>

  <rect x="183" y="138" width="125" height="54" rx="8" fill="#C2ECD9" stroke="#1D9E75" stroke-width="1"/>
  <text class="th" x="245" y="158" text-anchor="middle" dominant-baseline="central">Exercise is</text>
  <text class="th" x="245" y="176" text-anchor="middle" dominant-baseline="central">added</text>

  <rect x="373" y="138" width="125" height="54" rx="8" fill="#C2ECD9" stroke="#1D9E75" stroke-width="1"/>
  <text class="th" x="435" y="158" text-anchor="middle" dominant-baseline="central">Sets &amp; reps</text>
  <text class="th" x="435" y="176" text-anchor="middle" dominant-baseline="central">recorded</text>

  <rect x="556" y="138" width="105" height="54" rx="8" fill="#C2ECD9" stroke="#1D9E75" stroke-width="1"/>
  <text class="th" x="608" y="158" text-anchor="middle" dominant-baseline="central">Session is</text>
  <text class="th" x="608" y="176" text-anchor="middle" dominant-baseline="central">saved</text>

  <!-- Section: Agents -->
  <text class="label" x="20" y="228" dominant-baseline="central">Responsible agents</text>
  <line x1="20" y1="236" x2="660" y2="236" stroke="#ccc" stroke-width="0.5" stroke-dasharray="4 3"/>

  <line x1="72"  y1="192" x2="72"  y2="260" stroke="#aaa" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="245" y1="192" x2="245" y2="260" stroke="#aaa" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="435" y1="192" x2="435" y2="260" stroke="#aaa" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="608" y1="192" x2="608" y2="260" stroke="#aaa" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Agent circles -->
  <circle cx="72"  cy="282" r="22" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
  <text class="th" x="72"  y="282" text-anchor="middle" dominant-baseline="central">User</text>
  <circle cx="245" cy="282" r="22" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
  <text class="th" x="245" y="282" text-anchor="middle" dominant-baseline="central">User</text>
  <circle cx="435" cy="282" r="22" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
  <text class="th" x="435" y="282" text-anchor="middle" dominant-baseline="central">User</text>
  <circle cx="608" cy="282" r="22" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/>
  <text class="th" x="608" y="282" text-anchor="middle" dominant-baseline="central">System</text>

  <!-- Section: Obstacles -->
  <text class="label" x="20" y="330" dominant-baseline="central">Obstacles</text>
  <line x1="20" y1="338" x2="660" y2="338" stroke="#ccc" stroke-width="0.5" stroke-dasharray="4 3"/>

  <line x1="72"  y1="390" x2="72"  y2="192" stroke="#E24B4A" stroke-width="0.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <line x1="245" y1="390" x2="245" y2="192" stroke="#E24B4A" stroke-width="0.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <line x1="435" y1="390" x2="435" y2="192" stroke="#E24B4A" stroke-width="0.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <line x1="608" y1="390" x2="608" y2="192" stroke="#E24B4A" stroke-width="0.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <rect x="20"  y="390" width="105" height="54" rx="8" fill="#F7C1C1" stroke="#A32D2D" stroke-width="1"/>
  <text class="th" x="72"  y="410" text-anchor="middle" dominant-baseline="central">Session not</text>
  <text class="th" x="72"  y="428" text-anchor="middle" dominant-baseline="central">started</text>

  <rect x="183" y="390" width="125" height="54" rx="8" fill="#F7C1C1" stroke="#A32D2D" stroke-width="1"/>
  <text class="th" x="245" y="410" text-anchor="middle" dominant-baseline="central">No exercise</text>
  <text class="th" x="245" y="428" text-anchor="middle" dominant-baseline="central">added</text>

  <rect x="373" y="390" width="125" height="54" rx="8" fill="#F7C1C1" stroke="#A32D2D" stroke-width="1"/>
  <text class="th" x="435" y="410" text-anchor="middle" dominant-baseline="central">Invalid input</text>
  <text class="th" x="435" y="428" text-anchor="middle" dominant-baseline="central">(neg. values)</text>

  <rect x="556" y="390" width="105" height="54" rx="8" fill="#F7C1C1" stroke="#A32D2D" stroke-width="1"/>
  <text class="th" x="608" y="410" text-anchor="middle" dominant-baseline="central">Save</text>
  <text class="th" x="608" y="428" text-anchor="middle" dominant-baseline="central">failure</text>

  <!-- Section: Resolutions -->
  <text class="label" x="20" y="462" dominant-baseline="central">Resolutions</text>
  <line x1="20" y1="470" x2="660" y2="470" stroke="#ccc" stroke-width="0.5" stroke-dasharray="4 3"/>

  <line x1="72"  y1="528" x2="72"  y2="444" stroke="#555" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="245" y1="528" x2="245" y2="444" stroke="#555" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="435" y1="528" x2="435" y2="444" stroke="#555" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="608" y1="528" x2="608" y2="444" stroke="#555" stroke-width="0.5" marker-end="url(#arrow)"/>

  <rect x="20"  y="528" width="105" height="54" rx="8" fill="#C7E4A4" stroke="#3B6D11" stroke-width="1"/>
  <text class="th" x="72"  y="548" text-anchor="middle" dominant-baseline="central">Quick-start</text>
  <text class="th" x="72"  y="566" text-anchor="middle" dominant-baseline="central">prompt</text>

  <rect x="183" y="528" width="125" height="54" rx="8" fill="#C7E4A4" stroke="#3B6D11" stroke-width="1"/>
  <text class="th" x="245" y="548" text-anchor="middle" dominant-baseline="central">Exercise</text>
  <text class="th" x="245" y="566" text-anchor="middle" dominant-baseline="central">autocomplete</text>

  <rect x="373" y="528" width="125" height="54" rx="8" fill="#C7E4A4" stroke="#3B6D11" stroke-width="1"/>
  <text class="th" x="435" y="548" text-anchor="middle" dominant-baseline="central">Input</text>
  <text class="th" x="435" y="566" text-anchor="middle" dominant-baseline="central">validation</text>

  <rect x="556" y="528" width="105" height="54" rx="8" fill="#C7E4A4" stroke="#3B6D11" stroke-width="1"/>
  <text class="th" x="608" y="548" text-anchor="middle" dominant-baseline="central">Offline save</text>
  <text class="th" x="608" y="566" text-anchor="middle" dominant-baseline="central">+ auto-sync</text>

  <!-- Legend -->
  <rect x="20"  y="610" width="14" height="14" rx="3" fill="#DDD8FC" stroke="#7F77DD" stroke-width="1"/>
  <text class="ts" x="40" y="617" dominant-baseline="central">Root goal</text>
  <rect x="110" y="610" width="14" height="14" rx="3" fill="#C2ECD9" stroke="#1D9E75" stroke-width="1"/>
  <text class="ts" x="130" y="617" dominant-baseline="central">Sub-goal</text>
  <circle cx="200" cy="617" r="7" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
  <text class="ts" x="213" y="617" dominant-baseline="central">User actor</text>
  <circle cx="290" cy="617" r="7" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/>
  <text class="ts" x="303" y="617" dominant-baseline="central">System actor</text>
  <rect x="385" y="610" width="14" height="14" rx="3" fill="#F7C1C1" stroke="#A32D2D" stroke-width="1"/>
  <text class="ts" x="405" y="617" dominant-baseline="central">Obstacle</text>
  <rect x="465" y="610" width="14" height="14" rx="3" fill="#C7E4A4" stroke="#3B6D11" stroke-width="1"/>
  <text class="ts" x="485" y="617" dominant-baseline="central">Resolution</text>
</svg>
